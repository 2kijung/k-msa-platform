# ============================================================================
# auth-service / application.yml
# ============================================================================
# [무엇을] auth-service 한 개의 실행 설정.
# [왜/MSA] 각 서비스가 "자기만의 설정 + 자기만의 포트 + 자기만의 DB 스키마"를 갖는 것이 MSA.
#
# [DB 설계 방침 — 이력/실무 관점]
#   개발도 '실물 PostgreSQL'로 한다(H2 아님). 이유:
#     - 개발-운영 환경 일치(dev-prod parity, 12-factor): 운영에서만 나는 버그를 개발에서 미리 잡음
#     - JD가 요구하는 RDB/PostgreSQL 실물 경험을 이력에 남김
#   실물 DB는 infra/docker-compose.yml 의 postgres 컨테이너가 제공한다.
#   H2는 '단위 테스트'에서만 쓴다(빠르고 격리됨) → test 프로필로 분리.
# ============================================================================

server:
  # [왜] auth-service 전용 포트. monolith(8080)와 다른 프로세스임을 보장. 게이트웨이가 여기로 /auth/* 전달.
  port: 8081

spring:
  application:
    name: auth-service   # [왜] 관측성(메트릭/트레이싱)에서 서비스 식별 태그

  # ---- 기본(개발) 프로필: 실물 PostgreSQL (docker-compose의 postgres) ----
  datasource:
    # [왜/MSA] kmsa DB에 붙되 currentSchema=auth → auth-service는 'auth 스키마'만 본다.
    #          다른 서비스 스키마(content/contact...)는 접근하지 않는다(데이터 격리).
    # [전제] 먼저 `cd infra && docker compose up -d` 로 postgres를 띄워야 한다.
    # [왜] 호스트/DB명을 환경변수화 → 로컬 IDE 실행(기본 localhost)과 docker-compose 실행(postgres 서비스명)이
    #      동일한 설정을 공유한다. 컨테이너 안에선 DB_HOST=postgres 가 주입되어 컨테이너 네트워크로 붙는다.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kmsa}?currentSchema=auth
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:kmsa}
    password: ${DB_PASSWORD:kmsa1234}
  jpa:
    hibernate:
      # [왜] 개발 단계라 엔티티로 테이블 자동 생성/갱신. (운영은 validate + Flyway 예정 @DEEP)
      ddl-auto: update
    properties:
      hibernate:
        # [왜/MSA] Hibernate가 테이블을 만들/찾을 기본 스키마를 auth로 고정 → 스키마 경계 강제
        default_schema: auth
        format_sql: true
    open-in-view: false   # [왜] 커넥션을 뷰까지 안 끌고감(N+1·커넥션 낭비 방지)

jwt:
  # [보안] 서명 비밀키는 환경변수 주입. 기본값은 로컬 전용(운영에선 반드시 교체).
  secret: ${JWT_SECRET:local-dev-only-secret-change-me-please-32bytes-min}
  expiration: ${JWT_EXPIRATION:86400000}   # 24h(ms)

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus   # [왜] K8s probe + Prometheus 스크레이프만 노출
  metrics:
    tags:
      application: auth-service

---
# ============================================================================
# test 프로필: H2 인메모리 (단위 테스트 전용)
# [왜] 테스트는 빠르고 서로 격리돼야 한다. 실물 DB에 붙이면 느리고 상태가 오염된다.
#      MODE=PostgreSQL 로 문법을 Postgres에 맞춰 실물과 최대한 동일하게.
# [사용] 테스트 실행 시 spring.profiles.active=test
# ============================================================================
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:authdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop   # [왜] 테스트마다 깨끗한 스키마 생성 후 삭제

---
# ============================================================================
# prod 프로필: 운영 PostgreSQL (환경변수/Secret 주입)
# [왜/MSA] 개발과 동일하게 PostgreSQL. 접속 정보만 환경변수로 바뀌고 코드는 그대로.
# ============================================================================
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:kmsa}?currentSchema=auth
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate   # [왜] 운영은 자동 변경 금지, 스키마 검증만(스키마는 Flyway/수동 관리)
    properties:
      hibernate:
        default_schema: auth
