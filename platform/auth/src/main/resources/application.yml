# ============================================================================
# auth-service / application.yml
# ============================================================================
# [무엇을] auth-service 한 개의 실행 설정.
# [왜/MSA] 각 서비스가 "자기만의 설정 + 자기만의 포트 + 자기만의 DB 스키마"를 갖는 것이
#          MSA. 이 파일이 monolith와 완전히 분리돼 있다는 것 자체가 독립성의 증거다.
# ============================================================================

server:
  # [왜] auth-service 전용 포트. monolith(8080)와 다른 포트로 떠서 "다른 프로세스"임을 보장.
  #      게이트웨이가 /auth/* 요청을 이 포트로 보낸다.
  port: 8081

spring:
  application:
    # [왜] 서비스 이름. 관측성(Prometheus/트레이싱)에서 "어느 서비스 로그·메트릭인지" 식별하는 태그.
    name: auth-service

  # ---- 개발용 기본 프로필: H2 인메모리 (설치 없이 바로 실행) ----
  datasource:
    # [왜/MSA] auth-service는 'auth'라는 자기 스키마만 본다. monolith의 테이블을 직접 조회하지 않는다.
    #          (분산 모놀리스 회피: 남의 DB를 직접 읽으면 MSA가 아니다)
    url: jdbc:h2:mem:authdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      # [왜] 개발 단계라 엔티티로 스키마 자동 생성. 운영에선 Flyway 등으로 관리 예정(@DEEP)
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false   # [왜] 영속성 컨텍스트를 뷰까지 끌고가지 않음(N+1·커넥션 낭비 방지 관례)

# ---- JWT 설정 ----
jwt:
  # [왜/보안] 서명 비밀키. 절대 소스에 하드코딩하면 안 되므로 환경변수 주입(JWT_SECRET).
  #          기본값은 로컬 개발 전용. (K-portfolio가 평문 노출했던 약점을 여기서 교정)
  secret: ${JWT_SECRET:local-dev-only-secret-change-me-please-32bytes-min}
  # [왜] 토큰 유효기간(ms). 기본 24시간. 게이트웨이가 매 요청 검증하므로 만료가 곧 로그아웃.
  expiration: ${JWT_EXPIRATION:86400000}

# ---- 관측성(Actuator) ----
management:
  endpoints:
    web:
      exposure:
        # [왜/MSA] K8s probe(health)와 Prometheus 스크레이프(prometheus), 서비스 정보(info)만 노출.
        #          나머지는 숨겨 공격 표면 축소.
        include: health,info,prometheus
  metrics:
    tags:
      # [왜] 모든 메트릭에 이 서비스 이름을 태그로 → 나중에 Grafana에서 서비스별로 구분
      application: auth-service

---
# ============================================================================
# 운영 프로필(prod): PostgreSQL의 'auth' 스키마
# [왜/MSA] 개발은 H2, 운영은 Postgres. URL만 바뀌고 코드는 그대로 → JPA 추상화 덕.
#          default_schema=auth 로 이 서비스가 auth 스키마만 바라보게 격리.
# ============================================================================
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:kmsa}?currentSchema=auth
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate   # [왜] 운영에선 자동 변경 금지, 스키마 검증만
    properties:
      hibernate:
        default_schema: auth
