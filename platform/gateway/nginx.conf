# ============================================================================
# platform/gateway/nginx.conf — API 게이트웨이 (단일 진입점)
# ============================================================================
# [무엇을] 모든 외부 요청이 처음 닿는 곳. 요청을 알맞은 서비스로 라우팅하고,
#          인증이 필요한 요청은 auth-service에 검증을 위임한다.
# [왜/MSA] 프론트/클라이언트는 서비스가 몇 개로 쪼개졌는지 몰라야 한다(단일 진입점으로 은닉).
#          그리고 인증은 여기서 "한 번만" 확인하고, 하위 서비스로는 신뢰 헤더(X-User-Id)만 전달한다.
#
# [Strangler Fig 전략 — 지금 단계]
#   전환 초기라 아직 대부분 기능이 monolith에 있다. 그래서 게이트웨이는
#   "monolith로 통째 라우팅(무손상 기준선)" + "이미 분리한 auth만 auth-service로"를 한다.
#   서비스가 하나씩 분리될 때마다 아래 라우팅을 monolith → 해당 서비스로 옮긴다.
# ============================================================================

# [무엇을] 라우팅 대상(업스트림) 정의. 컨테이너 네트워크에선 서비스명이 곧 호스트다.
upstream auth      { server auth-service:8081; }    # 이미 분리된 인증 서비스
upstream contact   { server contact-service:8085; } # 분리된 문의 서비스 (Phase 2)
upstream content   { server content-service:8084; } # 분리된 콘텐츠 서비스 (Phase 3)
upstream blog      { server blog-service:8086; }    # 분리된 블로그 서비스 (Phase 4)
upstream analytics { server analytics-service:8087; } # 분리된 분석 서비스 (Phase 5)
upstream monolith  { server monolith:8080; }        # 아직 안 쪼갠 K-portfolio 백엔드

server {
    listen 80;
    server_name _;

    # ── 인증 검증 내부 엔드포인트 (auth_request 전용) ─────────────────────
    # [무엇을] 아래 보호 라우트들이 "이 요청 토큰 유효?"를 물으러 내부적으로 호출하는 곳.
    # [왜/MSA] internal = 외부에서 직접 못 부른다. 게이트웨이가 내부에서만 사용.
    #          auth-service의 GET /auth/verify 로 넘겨 검증시킨다(그 서비스가 200/401 응답).
    location = /auth/verify {
        internal;
        proxy_pass              http://auth/auth/verify;
        proxy_pass_request_body off;                       # [왜] 검증엔 본문 불필요 → 성능
        proxy_set_header        Content-Length "";
        proxy_set_header        Authorization $http_authorization;  # [핵심] 원요청의 토큰을 그대로 전달
    }

    # ── 공개 엔드포인트 (인증 없이 통과) ──────────────────────────────────
    # [왜] 로그인은 당연히 인증 전에 열려야 하고, 헬스체크는 probe가 접근해야 한다.
    location /api/auth/login  { proxy_pass http://auth/auth/login; }
    location /api/auth/health { proxy_pass http://auth/auth/health; }

    # [Phase 2/Strangler] 문의 접수(공개)는 monolith가 아니라 분리된 contact-service로 라우팅.
    #   monolith로 가던 /contacts 트래픽을 여기서 신규 서비스로 옮긴 것 = 서비스 분리 진행의 증거.
    location = /api/contacts { proxy_pass http://contact/contacts; }   # 공개: 문의 제출

    # [Phase 3/Strangler] 포트폴리오 콘텐츠 조회(공개) → content-service.
    #   monolith로 가던 /projects /careers /skills /certifications /profile 트래픽을
    #   content-service로 전환 = Strangler Fig 다음 단계.
    location /api/content/projects      { proxy_pass http://content/content/projects; }
    location /api/content/careers       { proxy_pass http://content/content/careers; }
    location /api/content/skills        { proxy_pass http://content/content/skills; }
    location /api/content/certifications{ proxy_pass http://content/content/certifications; }
    location /api/content/profile       { proxy_pass http://content/content/profile; }

    # [Phase 4/Strangler] 블로그 포스트 조회(공개) → blog-service.
    #   monolith의 BlogPost 도메인을 분리한 것 = 자동발행 스케줄러가 독립 배포 주기로 운영됨.
    location /api/blog/posts { proxy_pass http://blog/blog/posts; }

    # [Phase 5/Strangler] 방문자 통계(공개) + 방문 기록(공개) → analytics-service.
    #   [왜] 방문자 수는 포트폴리오 실제 운영 증거 — 공개 접근 가능한 통계.
    location /api/analytics/visitors { proxy_pass http://analytics/analytics/visitors; }
    location /api/analytics/stats    { proxy_pass http://analytics/analytics/stats; }

    # ── 보호 엔드포인트 (auth_request로 검증 후 X-User-Id 주입) ────────────
    # [무엇을] 그 외 모든 요청. 지금은 대부분 monolith로 보낸다(전환 초기).
    # [어떻게] 1) auth_request가 /auth/verify를 먼저 호출 → 실패(401)면 여기서 차단.
    #          2) 성공하면 auth가 응답에 실어준 X-User-Id/X-User-Role 헤더를 꺼내(auth_request_set)
    #          3) 하위 서비스(monolith)로 그 헤더를 주입해 전달한다.
    # [왜/MSA] monolith는 JWT를 다시 파싱하지 않고 이 X-User-Id 헤더만 신뢰하면 된다.
    #          → 인증은 게이트웨이에서 한 번, 신뢰는 헤더로 전파(분산 모놀리스 회피).
    location / {
        auth_request       /auth/verify;
        auth_request_set   $user_id   $upstream_http_x_user_id;
        auth_request_set   $user_role $upstream_http_x_user_role;
        proxy_set_header   X-User-Id   $user_id;
        proxy_set_header   X-User-Role $user_role;

        error_page 401 = @login;        # [왜] 미인증이면 로그인으로 유도
        proxy_pass         http://monolith;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    location @login { return 302 /api/auth/login; }

    # ------------------------------------------------------------------------
    # @DEEP 서비스가 분리될 때마다 여기에 라우트를 추가/이동한다:
    #   - 공개 조회(GET /api/projects 등)는 auth_request 없이 content-service로
    #   - /api/contacts(POST) 공개 → contact-service
    #   - /api/admin/** 보호 → 각 서비스 (X-User-Role=ADMIN 확인)
    #   즉 monolith로 가던 트래픽을 하나씩 신규 서비스로 옮기며 monolith를 비워간다.
    # @DEEP Phase 6: Spring Cloud Gateway로 승격 시 트레이싱 헤더(W3C traceparent) 전파 추가
    # ------------------------------------------------------------------------
}
