# analytics-service / application.yml
# [왜/MSA] 포트 8087. 스키마: analytics. 방문자 기록·통계 전담.
# @PHASE:5
server:
  port: 8087
spring:
  application:
    name: analytics-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kmsa}?currentSchema=analytics
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:kmsa}
    password: ${DB_PASSWORD:kmsa1234}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: analytics

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: analytics-service
  # [Phase 6] Zipkin 분산 트레이싱
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://${ZIPKIN_HOST:zipkin}:9411/api/v2/spans

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:analyticsdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
