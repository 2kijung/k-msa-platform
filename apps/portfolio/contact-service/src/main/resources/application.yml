# contact-service / application.yml
# [왜/MSA] 자기 포트(8085) + 자기 스키마(contact). auth-service(8081/auth)와 완전 분리.
server:
  port: 8085
spring:
  application:
    name: contact-service
  # [왜] 개발도 실물 PostgreSQL(dev-prod parity). auth-service와 같은 kmsa 인스턴스, 스키마만 contact로 격리.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kmsa}?currentSchema=contact
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:kmsa}
    password: ${DB_PASSWORD:kmsa1234}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: contact   # [왜/MSA] contact-service는 contact 스키마만 본다(데이터 격리)

# [왜/MSA] 알림은 별도 서비스(notification)를 REST로 호출 → 서비스 간 결합도 최소.
#          지금은 동기 REST, 추후 이벤트(messaging)로 전환 예정.
notification:
  service:
    url: ${NOTIFICATION_URL:http://localhost:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: contact-service
  # [Phase 6] 서킷브레이커 상태를 actuator/health에 포함
  health:
    circuitbreakers:
      enabled: true
  # [Phase 6] Zipkin 분산 트레이싱: contact→notification 호출 흐름을 traceId로 추적
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://${ZIPKIN_HOST:zipkin}:9411/api/v2/spans

# ─── Resilience4j 서킷브레이커 설정 (Phase 6) ─────────────────────────────
# [무엇을] notification-service 호출 실패 시 서킷을 열어 연쇄 장애를 차단한다.
# [왜/MSA] 분산 시스템에서 notification이 느려지면 contact의 스레드가 모두 대기 → 전체 장애.
#          서킷브레이커가 이를 감지하고 즉시 fallback → 본 흐름(문의 접수) 보호.
resilience4j:
  circuitbreaker:
    instances:
      notification:
        # 슬라이딩 윈도우 10건 중 50% 이상 실패 시 OPEN
        sliding-window-size: 10
        failure-rate-threshold: 50
        # OPEN 상태에서 5초 후 HALF-OPEN → 3건 시도
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 3
        # 예외를 실패로 기록
        record-exceptions:
          - org.springframework.web.client.RestClientException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
  timelimiter:
    instances:
      notification:
        # [왜] 알림 서비스 응답 대기 최대 2초. 초과 시 즉시 fallback.
        timeout-duration: 2s

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:contactdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
