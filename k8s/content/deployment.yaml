# [MSA] content-service Deployment + Service — K8s 독립 배포 단위
# [왜] Docker Compose에서 K8s로 승격: Self-healing + Rolling Update + HPA 지원
apiVersion: apps/v1
kind: Deployment
metadata:
  name: content-service
  namespace: kmsa
  labels:
    app: content-service
    tier: apps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: content-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: content-service
    spec:
      containers:
        - name: content-service
          image: 2kijung/kmsa-content-service:latest
          ports:
            - containerPort: 8084
          env:
            - name: DB_HOST
              value: postgres-service
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: kmsa
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: kmsa-secrets
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kmsa-secrets
                  key: db-password
            - name: ZIPKIN_HOST
              value: zipkin-service
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "400m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /content/health
              port: 8084
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /content/health
              port: 8084
            initialDelaySeconds: 20
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: content-service
  namespace: kmsa
spec:
  selector:
    app: content-service
  ports:
    - port: 8084
      targetPort: 8084
  type: ClusterIP
