# ============================================================================
# infra/docker-compose.yml — 로컬 개발용 실물 인프라
# ============================================================================
# [무엇을] 개발 PC에서 "실제 PostgreSQL"을 컨테이너로 띄운다.
# [왜/이력] H2(인메모리) 대신 실물 DB로 개발하면 개발-운영 환경이 일치(dev-prod parity)한다.
#          운영에서만 나는 버그(대소문자, 시퀀스, 트랜잭션 격리 등)를 개발 단계에서 미리 잡는다.
#          → "실물 DB로 설계하고 운영했다"가 이력/면접에서 사실이 된다.
# [왜/MSA] postgres 인스턴스는 하나지만, 서비스마다 '스키마'로 격리한다(auth/content/...).
#          이상적인 'DB per service'의 리소스 현실적 절충. 스키마 경계로 서비스 간 데이터를 분리.
# [어떻게] docker compose up -d 한 방으로 DB가 뜬다. auth-service는 이 DB에 붙는다.
# [주의] openclaw-msa/infra/docker-compose.yml과 같은 'infra' 폴더명 충돌 방지: name 고정.
# ============================================================================

name: k-msa-platform

services:
  postgres:
    # [왜] alpine = 경량 이미지. 16 = 최신 안정 메이저(K-portfolio도 16 사용, 버전 일치)
    image: postgres:16-alpine
    container_name: kmsa-postgres
    environment:
      # [무엇을] 최초 기동 시 생성되는 DB와 계정. (개발용 값 — 운영은 Secret 주입)
      POSTGRES_DB: kmsa
      POSTGRES_USER: kmsa
      POSTGRES_PASSWORD: kmsa1234
    ports:
      # [왜] 호스트 5432 → 컨테이너 5432. IDE/로컬 auth-service가 localhost:5432로 접속.
      - "5433:5432"
    volumes:
      # [왜] 데이터 영속화. 컨테이너를 지워도 DB 데이터는 이 볼륨에 남는다(재시작해도 유지).
      - kmsa-pgdata:/var/lib/postgresql/data
      # [왜/MSA] 최초 기동 시 이 폴더의 *.sql이 자동 실행된다 → 서비스별 스키마를 미리 생성.
      #          (postgres 이미지 규약: /docker-entrypoint-initdb.d 안의 스크립트를 초기 1회 실행)
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # [왜/MSA] DB가 "받을 준비"가 됐는지 확인. auth-service가 DB보다 먼저 떠서 연결 실패하는
      #          race condition을 막는 근거(서비스의 depends_on: condition: service_healthy와 짝).
      test: ["CMD-SHELL", "pg_isready -U kmsa -d kmsa"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── auth-service (Spring Boot) ──────────────────────────────────────────
  auth-service:
    # [왜/MSA] build = 이 서비스의 Dockerfile로 이미지를 직접 빌드. 각 서비스가 자기 이미지를 갖는다.
    #          context는 auth-service 프로젝트 루트(pom/Dockerfile 위치).
    build:
      context: ../platform/auth
    container_name: kmsa-auth
    depends_on:
      postgres:
        # [왜/MSA] postgres가 healthy(pg_isready 통과)된 뒤에 auth를 띄운다.
        #          DB보다 먼저 떠서 연결 실패하는 race condition을 막는다(부팅 순서 제어).
        condition: service_healthy
    environment:
      # [왜/MSA] 컨테이너 네트워크에선 DB 호스트가 localhost가 아니라 서비스명 'postgres'다(compose 내장 DNS).
      #          application.yml의 ${DB_HOST:localhost} 를 여기서 postgres로 오버라이드.
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: kmsa
      DB_USER: kmsa
      DB_PASSWORD: kmsa1234
      # [보안] JWT 서명키 주입. 로컬 데모용 — 운영에선 K8s Secret으로 주입.
      JWT_SECRET: local-dev-only-secret-change-me-please-32bytes-min
    ports:
      # [왜] 호스트 8081 → 컨테이너 8081. 게이트웨이/개발자가 이 포트로 auth에 접근.
      - "8081:8081"
    healthcheck:
      # [왜/MSA] K8s liveness/readiness probe의 compose판. auth가 실제 응답하는지 확인 → Self-Healing 기반.
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8081/auth/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── monolith (K-portfolio 백엔드, 전환 중 임시 존치) ─────────────────────
  monolith:
    # [왜/Strangler] 아직 안 쪼갠 K-portfolio 백엔드. 게이트웨이가 대부분 트래픽을 여기로 보낸다.
    #                서비스가 하나씩 분리될 때마다 이쪽 코드·라우트가 줄어든다.
    build:
      # [왜] monolith 안에 흡수된 K-portfolio 백엔드의 Dockerfile로 빌드
      context: ../apps/portfolio/monolith/dev-portfolio-backend
    container_name: kmsa-monolith
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod        # [왜] prod = PostgreSQL 프로필 활성
      DB_HOST: postgres
      DB_PORT: "5432"
      # [왜/MSA] 같은 postgres 인스턴스를 쓰되 monolith는 public 스키마(기본), auth-service는 auth 스키마
      #          → 데이터 격리 유지. @DEEP 추후 monolith도 portfolio 전용 스키마로 격리
      DB_NAME: kmsa
      DB_USER: kmsa
      DB_PASSWORD: kmsa1234
      # [왜] auth-service와 동일 서명키 (전환 중 K-portfolio 자체 인증과 토큰 호환)
      JWT_SECRET: local-dev-only-secret-change-me-please-32bytes-min
    ports:
      - "8080:8080"   # [왜] 게이트웨이 뒤라 필수는 아니나 개발 디버깅용 노출

  # ── content-service (포트폴리오 콘텐츠 CRUD, Phase 3) ──────────────────
  content-service:
    # [왜/MSA] Phase 3 — monolith에서 Project·Career·Skill·Cert·Profile 분리.
    #          Strangler Fig: 게이트웨이 라우트를 monolith→content-service로 전환.
    build:
      context: ../apps/portfolio/content-service
    container_name: kmsa-content
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: kmsa
      DB_USER: kmsa
      DB_PASSWORD: kmsa1234
    ports:
      - "8084:8084"

  # ── contact-service (문의 접수 + 알림, Phase 2) ─────────────────────────
  contact-service:
    build:
      context: ../apps/portfolio/contact-service
    container_name: kmsa-contact
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: kmsa      # [왜/MSA] 같은 인스턴스, contact 스키마로 격리
      DB_USER: kmsa
      DB_PASSWORD: kmsa1234
      # [왜] 알림 서비스 URL. notification-service 미기동 시 호출은 실패하나
      #      문의 접수 본흐름은 정상(NotificationClient가 실패를 삼킴).
      NOTIFICATION_URL: http://notification:8083
    ports:
      - "8085:8085"

  # ── notification-service (알림, Telegram) ───────────────────────────────
  notification:
    # [왜/MSA] contact가 REST로 호출하는 알림 서비스. 서비스명 'notification'이 곧 DNS 호스트.
    build:
      context: ../platform/notification
    container_name: kmsa-notification
    environment:
      # [왜] 봇 설정이 비면 실제 전송은 건너뛰고 로그만 → 데모 시 토큰 없이도 안전하게 흐름 확인 가능
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    ports:
      - "8083:8083"

  # ── gateway (Nginx API 게이트웨이) ──────────────────────────────────────
  gateway:
    # [왜/MSA] 단일 진입점. 외부는 여기(80)로만 접근하고 내부 서비스(auth/monolith)는 숨긴다.
    image: nginx:1.27-alpine
    container_name: kmsa-gateway
    depends_on:
      - auth-service
      - monolith
    volumes:
      # [왜] 우리가 작성한 라우팅 규칙을 nginx가 읽는 conf.d 위치에 읽기전용 마운트
      - ../platform/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # [왜/로컬] 8090 사용: 로컬 개발 환경에서 Caddy(k-devops.duckdns.org)가 80/443 점유.
      #           게이트웨이 기능(라우팅·auth_request) 검증은 동일, 포트만 다름.
      #           운영(K8s)에서는 Ingress가 80/443 담당 → 이 포트는 로컬 전용.
      - "8090:80"

  # ── prometheus (메트릭 수집) ────────────────────────────────────────────
  prometheus:
    # [왜/MSA] 각 서비스의 /actuator/prometheus를 긁어 메트릭을 한 곳에 모은다(통합 관측).
    image: prom/prometheus:v2.54.1
    container_name: kmsa-prometheus
    volumes:
      - ../platform/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9091:9090"   # [왜] Prometheus UI. http://localhost:9090

  # ── grafana (대시보드 시각화) ───────────────────────────────────────────
  grafana:
    # [왜] Prometheus 데이터를 그래프로. 서비스별 지연·에러·처리량 패널 → 이력/면접용 스크린샷.
    image: grafana/grafana:11.2.0
    container_name: kmsa-grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin   # [데모] 로컬 전용 비번
    ports:
      - "3000:3000"   # [왜] Grafana UI. http://localhost:3000 (admin/admin)

# [왜] 명명된 볼륨. 위 postgres가 데이터를 여기 저장.
volumes:
  kmsa-pgdata:
